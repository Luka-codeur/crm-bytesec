# Stack de production (VPS) : Caddy (HTTPS auto) -> front + API + Keycloak.
# Aucun port applicatif n'est publié : seul Caddy écoute sur 80/443.
#
#   cp docker/.env.prod.example docker/.env.prod   # puis renseigner les valeurs
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod up -d --build
name: crm-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?CRM_DOMAIN requis}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN requis}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
      - keycloak

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-crm}']
      interval: 10s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.31
    command: update
    environment:
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crm}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-crm}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../db/liquibase/changelog:/liquibase/changelog:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    restart: unless-stopped
    # Mode production derrière Caddy (TLS terminé par le proxy).
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN requis}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD requis}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-crm}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      # Substitués dans realm-crm.prod.json à l'import.
      CRM_DOMAIN: ${CRM_DOMAIN}
    volumes:
      - ./keycloak/realm-crm.prod.json:/opt/keycloak/data/import/realm-crm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: '3000'
      CORS_ORIGIN: https://${CRM_DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm}
      # Récupération des clés (JWKS) par le réseau interne ; l'émetteur du jeton est l'URL publique.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: https://${AUTH_DOMAIN}/realms/${KEYCLOAK_REALM:-crm}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-crm}
      KEYCLOAK_CLIENT_ID: crm-frontend
    depends_on:
      liquibase:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_USE_MOCK: 'false'
        VITE_API_URL: '' # même domaine : Caddy route /api vers le backend
        VITE_KEYCLOAK_URL: https://${AUTH_DOMAIN}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-crm}
        VITE_KEYCLOAK_CLIENT_ID: crm-frontend
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
